[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stm-bench"
version = "0.1.0.dev0"
description = "STM-Bench: a simulated scanning tunnelling microscope (stmsim) and an evidence-based benchmark for experimental agents, with a standalone MCP instrument interface (stmbench)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Yuanhao Lyu" }]
keywords = ["STM", "scanning tunnelling microscopy", "controller", "simulator", "LLM benchmark", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pyyaml>=6",
]

[project.optional-dependencies]
# calibration indices, Track A manifests, report tables; replay and mode-H pictures (matplotlib)
bench = ["pandas>=2.2", "pyarrow>=15", "matplotlib>=3.9"]
dev = ["pytest>=8"]
# stmbench agent --provider anthropic: Claude through the official SDK
agent = ["anthropic>=1.15"]

[project.scripts]
stmsim = "stmsim.__main__:main"
stmbench = "stmbench.cli:main"

[tool.setuptools.packages.find]
include = ["stmsim*", "stmbench*"]

[tool.setuptools.package-data]
stmsim = ["profiles/*.yaml", "spec/*.json"]
stmbench = ["trackB/scenarios/*.yaml", "replay/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_data: needs the STM_BENCH_DATA directory (calibration tables, corpus indices); skipped when absent",
]
