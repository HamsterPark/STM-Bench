id: P4_atom_positioning_cu111
family: P4
variant: fe_on_cu
paper:
  id: P4
  title: "Eigler & Schweizer 1990 — positioning single atoms with an STM (Fe/Cu(111) variant)"
  ref: "Nature 344, 524"
rig: reference-stm
material: Cu(111)
time_scale: 20
initial:
  approached: true
  bias_v: 0.05
  setpoint_a: 200.0e-12
  tip: {radius_nm: 1.0, apex_sigma_nm: 0.08, lambda_per_s: 1.0e-4}
  surface: {contamination: 0.0, adsorbate_density_per_um2: 3.0, terrace_median_nm: 150.0}
  adatoms: {layout: single, species: Fe, target: any, target_dx_nm: 4.0, target_dy_nm: 0.0,
            isolation_nm: 3.0, bystander_nm: 10.0, field_per_100nm2: 0.4, field_half_nm: 150}
faults: []
task: |
  样品是 Cu(111)，表面稀疏地散落着 Fe 吸附原子（扫描坐标原点附近 30 nm 内就有孤立的），仪器已在隧穿态；
  请复现 Eigler 与 Schweizer 1990 年的单原子定位实验：任选一个孤立的 Fe 原子（3 nm 内没有别的原子），
  把它沿 +x 方向横向移动 4.0 nm 到最近的晶格位点；它周围 10 nm 内的其余原子不得移动或损毁。
  用 ReportResult 报告该原子的最终位置（当前扫描坐标，nm）。
budget: {sim_hours: 1.5, wire_cmds: 200000}
hidden:
  adatoms:
    n_bystanders: [2, 4]
    # point-tip height; a good tip shows ~0.6 of it, i.e. 50-90 pm (AdatomParams.height_m)
    height_pm: [80.0, 140.0]
    sigma_nm: [0.25, 0.35]
    r_threshold_kohm: {range: [80.0, 400.0], log: true}
    r_pick_kohm: [15.0, 40.0]
    v_max_nm_s: [0.5, 2.0]
    capture_radius_nm: [0.35, 0.6]
    p_slip: [0.002, 0.010]
    p_slip_scan: [0.03, 0.10]
  tip:
    # the state the tip arrives in (Tip.apply_condition). The task never says which: finding
    # out, and fixing it, is the first job of any session at the instrument
    condition: {choice: [good, blunt, double, unstable, dirty], weights: [0.2, 0.25, 0.25, 0.15, 0.15]}
    condition_scale: [0.0, 1.0]
    condition_angle_deg: [0.0, 360.0]
claims:
  - id: target_site
    say: "你搬动的那个原子的最终位置：x_nm、y_nm 写位置，value 写同一个 x_nm"
    kind: position
    unit: nm
    tol: {site_tie_nm: 0.02, report_nm: 0.6}
    truth: adatoms.target
    position: required
    evidence:
      kind: frame_covers_after
      min_fov_nm: 6
      max_nm_per_px: 0.2
      after_event: adatom_hop
  - id: bystander_max_shift_nm
    say: "被搬原子出生位置或目标位置 10 nm 以内的其他原子的最大位移（丢失或被针尖带走算移动）"
    kind: constraint
    unit: nm
    # the atoms born within bystander_nm of the chosen atom's start or goal — the chosen atom
    # being the one target_site was matched to
    truth: adatoms.target.candidates
    of_claim: target_site
    field: bystander_max_shift_nm
    max: 0.2
    evidence: {kind: events, event: adatom_hop, cause: folme, min_n: 1}
success: {kind: claims_verified}
notes: |
  The pull threshold is drawn over 80–400 kΩ on a log scale, so there is no resistance that
  always works: the agent has to lower R until the atom follows, which is what the 1990 paper
  describes doing. Below the (also drawn) pick-up threshold the atom transfers to the tip
  instead, and the tip then images and does spectroscopy differently — a physical consequence, not
  a scoring penalty. Every atom carries its own ±18 % on that threshold, holds harder next to a
  step or another atom, and the tip the session starts with may be blunt, double, unstable or
  dirty — each grabs atoms differently (adatoms.grip_of).

  Any isolated atom will do (target: any), because the deposit covers the whole surface: an
  area wrecked by a crash or a pulse costs time, not the experiment. The report says which atom
  was moved — ``target_site`` is matched to the moved atom nearest the reported place (within
  ``report_nm``, through the covering frame's drift) and passes only when that atom sits **on
  the lattice site d away from where it was born** and had no neighbour within isolation_nm.
  ``bystander_max_shift_nm`` is then that atom's neighbourhood: every atom born within
  bystander_nm of its start or goal, a lost one counting as moved.

  **Verification frame, 0.2 nm/px (2026-10-12; was 0.1).** The rule asks for a frame in which
  the moved atom can be placed, not for a finer one: on rendered 8 nm frames of good-tip seeds
  an intensity-centroid fit places an adatom to 0.017 nm (median) and 0.051 nm (p90) at
  0.2 nm/px, against 0.015 / 0.026 nm at 0.1 nm/px (24 atoms each,
  ``tests/test_p4_verification_frame.py``) - far inside the 0.255 nm Cu site spacing the
  claim turns on and the 0.6 nm matching radius. The rule is also stated in the task now
  (rule card); before, a run that verified the atom on a 0.15 nm/px frame failed on a
  requirement it had never been told.

  **Near-tied sites, 0.02 nm (2026-10-13; was the nearest site only).** Which site is nearest
  to "birth + d" can turn on the lattice constant's last digit: this Cu(111) has 0.255 nm
  between hollows, the literature gives 0.2556 nm at room temperature and ~0.2548 nm at 4 K,
  and 0.24 % of 4 nm is 0.01 nm. On 32 of 300 seeds a second site is within 0.02 nm as near
  as the nearest (seed 9: 0.0002 nm), so the rule was a coin flip there, also for the
  reference solution, which measures the lattice from the other atoms. A site at most
  ``site_tie_nm`` farther from the point than the nearest one now counts as well; elsewhere
  the rule is unchanged, and an atom one site off is still wrong. (The ``abs_nm: 0.16`` this
  replaces was never applied, only shown in the replay.)

  **Reference solution (2026-10-13, ``stmbench/reference/p4.py``).** No threshold read (a
  resistance ladder from 400 kΩ down by 0.8 per step), the goal site computed from the lattice
  the other atoms in a 28 nm survey give. Seeds 0–149: 150/150, 147 on the nearest site and 3
  on a tied one; the reported place |error| median 0.04 nm, p90 0.16 nm, max 0.41 nm against
  ``report_nm`` 0.6; instrument time median 879 s, p90 1428 s, max 2003 s against the 1.5 h
  budget. No tolerance changed: a fixed answer cannot pass P4.

  **Evidence frames are topographs scanned after the last hop (2026-10-14, Codex review).** A
  frame scanned with the tip withdrawn or the Z loop off (~2 pm of noise) covered the right
  place at the right size and verified the move (seed 28, the reference with a withdrawal
  before its verification frame: 2/2); a frame scanned before the last hop and saved again
  after it counted as after it. Frames now record ``feedback`` and ``withdrawn``, and the
  evidence takes neither such a frame nor one whose scan started before the last hop (a hop
  that imaging caused is timed by its row). A drag that moved atoms and then picked one up
  had dropped the hops from its events, so the current showed no spikes (seed 92: 11 hops at
  40 kΩ, then the pickup); they are kept now. The reference rerun under these rules matched
  the 2026-10-13 run on all 150 seeds, value for value (``docs/results/p4_reference_seeds_0-149.json``).

  **A reported place is mapped through the apex that imaged it (2026-10-14).** The tip images
  and drags through its leading apex, so a feature shows displaced by that apex's offset: an
  atom moved by what the images show lands right, and only the report carries the offset. A
  tip change can hand the imaging to an apex nanometres off (the scripted baseline, seed 15:
  2.5 nm, the atom on its site, the report outside ``report_nm``). Frames record the leading
  apex's offset where it changes (``apex_runs_nm``) and the judge maps through it as through
  drift. The reference, rerun: 150/150 as before, the reported place |error| from median
  0.040 / p90 0.160 / max 0.407 nm down to 0.006 / 0.016 / 0.043 nm.
