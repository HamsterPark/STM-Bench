id: P2_standing_waves_cu111
family: P2
variant: step_and_adatoms
paper:
  id: P2
  title: "Crommie, Lutz, Eigler 1993 — standing waves in a two-dimensional electron gas"
  ref: "Nature 363, 524 (with Hasegawa & Avouris, PRL 71, 1071)"
rig: reference-stm
material: Cu(111)
time_scale: 20
initial:
  approached: true
  bias_v: 0.05
  setpoint_a: 1.0e-9
  tip: {radius_nm: 1.2, apex_sigma_nm: 0.09, lambda_per_s: 1.5e-4}
  surface:
    contamination: 0.0
    surface_state: {material: "Cu(111)"}
  spectroscopy:
    # the sample facts supplied before any dI/dV: where to stabilise, and the
    # window to sweep. The window only has to contain the band edge, which the task says too.
    condition: {stab_bias_v: 0.1, stab_setpoint_a: 1.0e-9, start_v: -0.6, end_v: 0.4,
                num_points: 200, label: "P2 surface state"}
faults: []
task: |
  样品是 Cu(111)，已在隧穿态；请复现 1993 年 Cu(111) 表面态电子驻波的观测：在台阶边或孤立吸附原子
  附近，采集一组随距离与能量变化的 dI/dV 谱，由驻波波长随能量的变化拟合出表面态的带底 E0（meV）
  与有效质量 m*（以电子质量为单位），用 ReportResult 报告。
task_en: >-
  The sample is Cu(111), and the instrument is already in the tunnelling state. Please reproduce
  the 1993 observation of standing waves of the surface-state electrons on Cu(111): near a step
  edge or an isolated adatom, record a set of dI/dV spectra as a function of distance and energy,
  fit the band bottom E0 (meV) and the effective mass m* (in units of the electron mass) of the
  surface state from the variation of the standing-wave wavelength with energy, and report them
  with ReportResult.
budget: {sim_hours: 3.0, wire_cmds: 400000}
hidden:
  surface:
    # dense enough that a 100 nm survey frame holds two to four isolated scatterers. The
    # 3 / um2 default puts 0.03 in such a frame, and this paper is about scattering.
    adsorbate_density_per_um2: [150.0, 400.0]
  surface_state:
    e0_ev: [-0.47, -0.41]
    m_star: [0.35, 0.42]
    gamma_f_ev: [0.004, 0.010]
    gamma_0_ev: [0.012, 0.024]
    step_r_up: [0.35, 0.65]
    step_r_down: [0.25, 0.55]
    step_phi_up_rad: [2.64, 3.64]
    step_phi_down_rad: [2.64, 3.64]
    point_delta_rad: [0.9, 1.5]
    point_absorption: [0.30, 0.60]
    step_height: [0.4, 0.8]
  tip:
    # the state the tip arrives in (Tip.apply_condition). The task never says which: finding
    # out, and fixing it, is the first job of any session at the instrument
    condition: {choice: [good, blunt, double, unstable, dirty], weights: [0.2, 0.25, 0.25, 0.15, 0.15]}
    condition_scale: [0.0, 1.0]
    condition_angle_deg: [0.0, 360.0]
claims:
  - id: e0_mev
    say: "Cu(111) 表面态的带底能量 E0（相对费米能级）"
    say_en: "Band-bottom energy E0 of the Cu(111) surface state (relative to the Fermi level)"
    kind: scalar
    unit: meV
    # material constants: knowing them is part of the skill (see the chance audit)
    knowledge: allowed
    tol: {abs: 15}
    truth: surface_state.e0_mev
    evidence: &spectra
      kind: any_of
      rules:
        - kind: spectra_near_scatterer
          min_n: 8
          min_positions: 6
          near_nm: 8.0
          min_points: 64
          v_lo_max: -0.5
          v_hi_min: 0.1
        # the 1993 experiment's own route: dI/dV maps at several energies, each one frame and
        # free of drift within it (2026-10-13, with the simulator's lock-in map channel)
        - kind: didv_maps
          min_n: 4
          min_energies: 4
          v_lo_max: -0.3
          v_hi_min: 0.05
          near_nm: 10.0
          min_fov_nm: 15
          max_nm_per_px: 0.3
  - id: m_eff
    say: "表面态电子的有效质量 m*（以自由电子质量 m_e 为单位）"
    say_en: "Effective mass m* of the surface-state electrons (in units of the free-electron mass m_e)"
    kind: scalar
    unit: m_e
    knowledge: allowed
    tol: {rel: 0.02}
    truth: surface_state.m_star
    evidence: *spectra
success: {kind: claims_verified}
notes: |
  The generator is deliberately richer than the parabola the agent fits: an energy-dependent
  lifetime, a complex reflection phase at the step (the Struve term), thermal and lock-in
  broadening and a finite phase-coherence length all sit on top of E0 and m*.

  **Tolerances, measured 2026-09-07** on the generator: twelve energies x 96 distances with
  2 % noise, fitted with a standing-wave dispersion fit, over twelve draws of
  the hidden block. |E0 error| had a median of 4.7 meV and a p90 of 6.0 meV; the relative m*
  error a median of 0.5 % and a p90 of 0.8 %. The claims ask for 15 meV and 2 %, about twice
  those p90s.

  **What the instrument delivers is not yet that** (2026-09-07). The scripted baseline reaches
  a dispersion with r2 ~= 0.88, but E0 lands about 60 meV high and m* about 30 % high, so mode
  C reproduces 0/2. The gap is in the acquisition, not the analysis:

  * the line is 45 spectra, and the wavevector needs three samples per half-wavelength, which
    at the Fermi level is 1.5 nm — so the spectra have to sit under 0.5 nm apart and the line
    still has to reach 13 nm out;
  * that takes the better part of two hours of instrument time, over which the sample drifts.
    The baseline re-locates the step before every batch of nine and measures each distance
    against the edge as it was then, which is what an experimenter does, and it is still the
    dominant error;
  * dI/dV carries 3 % noise per point here against the 2 % the generator assumed.

  The tolerances are NOT being widened to make this pass. What the paper's own experiment did
  was take dI/dV *maps* — one frame per energy, a hundred times faster per distance point and
  immune to drift within a frame — and the simulator does not fill a lock-in image channel yet
  (docs/DESIGN.md section 9). That is the fix.

  The scatterer is a step edge: ``LocateStepEdge`` reports where it runs, and a straight
  reflector is the J0 the fit assumes. A point defect biases m* by about twenty percent,
  because the LDOS around one goes as J0 squared with a Y0 cross term.

  Adsorbate density is drawn over 150–400 / µm², which puts two to four scatterers in a 100 nm
  survey frame — the 3 / µm² default puts 0.03 there, and this paper is about scattering. The
  scatterer is a point defect rather than a step edge because a point defect is the one an
  agent can locate: ``ExtractClusters`` reports cluster positions, while nothing in
  the stack reports the geometry of a step. Eight spectra at six distinct places spanning
  −0.5…+0.1 V is the minimum that constrains a dispersion at all.

  **2026-11-28: the instrument delivers it — a reference solution and a baseline.** The
  paragraphs above are the history of 2026-09-07 and stay as written; ``LocateStepEdge`` and
  ``ExtractClusters`` are skills of that MAST-era scripted baseline, not part of this repository.
  Since 2026-10-13 the simulator fills a lock-in dI/dV channel and the evidence accepts dI/dV
  maps (``any_of``). Both current solutions take that route, the 1993 one: eight maps from -0.30
  to +0.12 V, 24 nm at 0.2 nm/px, the fast axis across a step edge (found in the topograph) with a
  terrace >= 60 nm wide on the profile's side, every row aligned at its own edge, a standing-wave
  fit with a free phase (cos phi J0 + sin phi H0), k^2 against E (``stmbench.analysis.standing_waves``;
  docs/DESIGN.md section 9.12). Code 6ea5e18 on khwu, job 70512:

  * Reference (``reference --paper P2``, the truth navigates), seeds 0-29: 30/30; |m* error|
    median 0.28 %, p90 0.66 %, max 0.85 %; |E0 error| median 0.85, p90 2.0, max 2.3 meV;
    instrument time median 1213 s, p90 1401 s.
  * Baseline (``baseline --paper P2``, no truth): development seeds 0-69 66/70; held-out seeds
    300-329, run once on the final code, 30/30 (|m* error| p90 1.00 %, max 1.93 %; |E0 error| p90
    2.3 meV; instrument time of the successes median 2097 s, p90 5816 s, max 7229 s). The four
    development failures are the baseline's own: a second apex its repairs did not remove (two
    seeds), a tip that kept changing on a bent stretch of edge until no new round was started,
    and a set of maps mixed from two rounds across a bend of the edge.
  * The 2 % on m* is three times the reference's p90 and about twice the baseline's; it stays. The
    15 meV on E0 is seven times the reference's p90; it stays too (a material constant, knowledge
    allowed, no chance gate). The 3 h budget is 7.7 times the reference's p90 but only 1.9-2.1
    times the baseline's (P3, P4 and P3's repair variant sit at about 3 times theirs); no run
    failed on it, the baseline starts no new round after 6500 s. Whether to raise it is open.
  * Two simulator fixes came out of this work (docs/DESIGN.md section 9.3): scipy 1.18.1's
    struve(0, z) returns NaN on an interval at z = 25.765, which blanked whole dI/dV maps; and the
    step's standing wave is now a function of the distance across the local edge, where it was the
    distance along the mean normal (across a bent stretch of step, a profile across the local edge
    read k up to 4 % high, m* about twice that). The hidden block and the scenario id have not
    changed since the chance audit of 2026-10-12 (16 %, docs/DESIGN.md section 2), so it holds.
