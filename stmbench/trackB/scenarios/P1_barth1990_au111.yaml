id: P1_barth1990_au111
family: P1
variant: domains
paper:
  id: P1
  title: "Barth, Brune, Ertl, Behm 1990 — Au(111) 22x sqrt(3) herringbone reconstruction"
  ref: "Phys. Rev. B 42, 9307"
rig: reference-stm
material: Au(111)
time_scale: 20
initial:
  approached: true
  bias_v: 0.1
  setpoint_a: 50.0e-12
  tip: {radius_nm: 1.5, apex_sigma_nm: 0.07, lambda_per_s: 2.0e-4}
  surface:
    contamination: 0.0
    adsorbate_density_per_um2: 150.0
    terrace_median_nm: 250.0
    # the lines bend at the elbows without a jump, as in the paper (stmsim/physics/herringbone.py;
    # a fixed choice, no random draw)
    herringbone: {elbow: continuous}
faults: []
task: |
  样品是退火良好的 Au(111)/mica，已在隧穿态；请复现 Barth 等 1990 年对 Au(111) 22×√3 重构的
  STM 观测。重构表现为起伏线（亮条纹），整组起伏线以锯齿形周期性地改变方向；按原文的说法，
  起伏线朝同一方向延伸的一段区域是一个旋转畴，锯齿的每一条臂就是一个。请测出起伏线的周期
  （同一个旋转畴内、相邻两条亮条纹之间垂直于线的距离）与某一处起伏线的方向（给出该处坐标），
  并找到至少两个线方向不同的旋转畴、分别报告其位置与线方向。每个结果用 ReportResult 报告。
task_en: >-
  The sample is well-annealed Au(111)/mica, and the instrument is already in the tunnelling
  state. Please reproduce the STM observations of Barth et al. (1990) on the 22×√3 reconstruction
  of Au(111). The reconstruction shows corrugation lines (bright stripes) whose whole sets change
  their direction periodically in a zigzag; as the paper puts it, a stretch in which the lines run
  in one direction is a rotational domain, each arm of the zigzag being one. Measure the period of
  the lines (the distance between two adjacent bright stripes, perpendicular to them, within one
  rotational domain) and the direction of the lines at one place (give the coordinates of that
  place), and find at least two rotational domains whose lines run in different directions and
  report the position and line direction of each. Report each result with ReportResult.
budget: {sim_hours: 3.0, wire_cmds: 400000}
hidden:
  herringbone:
    # Barth et al. 1990: lines bending by +-120 deg (arms 60 deg apart: alpha = 30 deg, the rows of the
    # top layer turned ~1.5-2 deg against the bulk, p. 9312), ~250 A between elbow lines (one arm; a
    # full zigzag ~500 A, ~200 A in a less ordered area, p. 9311), 63 A between the lines of an arm
    # (T cos alpha, p. 9310). Ranges set 2026-11-27; draws and their order unchanged.
    period_nm: [6.9, 7.6]
    chevron_period_nm: [40.0, 60.0]
    arm_half_angle_deg: [28.0, 32.0]
    amp_pm: [8.0, 15.0]
    second_harmonic: [0.1, 0.4]
    domain_spacing_nm: [200.0, 500.0]
    boundary_width_nm: [2.0, 5.0]
  tip:
    # the state the tip arrives in (Tip.apply_condition). The task never says which: finding
    # out, and fixing it, is the first job of any session at the instrument
    condition: {choice: [good, blunt, double, unstable, dirty], weights: [0.2, 0.25, 0.25, 0.15, 0.15]}
    condition_scale: [0.0, 1.0]
    condition_angle_deg: [0.0, 360.0]
claims:
  - id: stripe_period_nm
    say: "起伏线的周期：同一个旋转畴（锯齿的一条臂）内，相邻两条亮条纹之间、垂直于线的距离"
    say_en: "Period of the corrugation lines: the distance between two adjacent bright stripes, perpendicular to them, within one rotational domain (one arm of the zigzag)"
    kind: scalar
    unit: nm
    # a material constant: knowing it is part of the skill, so the chance audit records how
    # often a fixed answer passes but does not hold the claim to the guessing gate
    knowledge: allowed
    tol: {abs: 0.15}
    truth: herringbone.period_along_arm_nm
    evidence: {kind: frame, min_fov_nm: 100, max_nm_per_px: 0.4}
  - id: stripe_orientation_deg
    say: "某一处起伏线（亮条纹）延伸的方向，并用 x_nm、y_nm 给出该处位置"
    say_en: "The direction in which the corrugation lines (the bright stripes) run at one place; give that place's position in x_nm and y_nm"
    kind: angle
    unit: deg
    # the reference's |error| p90 1.20, max 1.85 deg (2026-11-27): see notes, "Tolerances, re-derived"
    tol: {abs: 3, mod: 180}
    truth: orientation_at
    local: true
    position: required
    evidence: {kind: frame_covers, min_fov_nm: 40, max_nm_per_px: 0.5}
  - id: domain_a_orientation_deg
    say: "第一个旋转畴中起伏线延伸的方向，并用 x_nm、y_nm 给出该畴内一处位置"
    say_en: "The direction in which the lines run in a first rotational domain; give the position of one place inside that domain in x_nm and y_nm"
    kind: angle
    unit: deg
    tol: {abs: 3, mod: 180}
    truth: orientation_at
    local: true
    position: required
    evidence: {kind: frame_covers, min_fov_nm: 40, max_nm_per_px: 0.5}
  - id: domain_b_orientation_deg
    say: "第二个旋转畴（线方向与第一个不同）中起伏线延伸的方向，并用 x_nm、y_nm 给出该畴内一处位置"
    say_en: "The direction in which the lines run in a second rotational domain, whose lines run in a different direction from the first one's; give the position of one place inside it in x_nm and y_nm"
    kind: angle
    unit: deg
    tol: {abs: 3, mod: 180}
    truth: orientation_at
    local: true
    position: required
    distinct_from: {claim: domain_a_orientation_deg, min_sep_deg: 30}
    evidence: {kind: frame_covers, min_fov_nm: 40, max_nm_per_px: 0.5}
success: {kind: claims_verified}
notes: |
  **What is measured (since 2026-11-27).** The surface follows Barth et al. (1990): corrugation
  lines that bend by ±120° in a zigzag (unoriented lines 60° apart: alpha about 30°), about
  250 Å between the elbow lines, 63 Å between the lines of an arm. As the paper says, each arm
  is a rotational domain ("rotational domains are arranged in a zigzag pattern"). The period
  claim is the distance between the lines of one arm, perpendicular to them
  (``herringbone.period_along_arm_nm``, T·cos alpha). The orientation claims are judged on the
  direction of the lines at the reported place (``local: true``: ``stripe_local_deg`` of
  ``orientation_at``), and that alone. Until 2026-11-27 the elbows jumped (the phase drifted
  along the stripes), which left a spectral peak on the mean direction, often as strong as an
  arm, that an FFT reading could take for the stripes; the mean direction or either arm was
  then accepted, and a domain was a whole zigzag region (docs/DESIGN.md, P1 section).

  **Tolerances, measured 2026-09-07** (on the physics before 2026-11-27; re-derived from the
  new reference, see below) with the scripted baseline's own route (a 400 nm frame,
  ``FindFlatRegion`` for step-free 120 nm windows, ``AssessHerringbone`` on each at 0.31
  nm/px, the period taken as the median over the windows) across ten draws: |period error|
  had a median of 0.007 nm, a p90 of 0.063 nm and a worst case of 0.136 nm; the orientation
  error a median of 3.1° with the worst window at 6.6°, and under 1.4° on the 120 nm windows
  the claim actually uses. The claims then asked for 0.15 nm and 6°.

  **Tolerances, re-derived 2026-11-27** for the paper's herringbone, from the privileged
  reference (``stmbench/reference/p1.py``; khwu job 70257, code 0c01692, seeds 0–29, 30/30). It
  reports at two places in the middle of neighbouring arms, found in one 102–140 nm frame by
  ``stmbench/analysis/herringbone.py``. Against the line direction at the reported place, its 90
  orientation reports had |error| p50 0.67°, p90 1.20°, max 1.85° (``stripe_orientation_deg`` and
  ``domain_a_orientation_deg`` are one measurement). The tolerance is the smallest whole degree
  that is at least twice the p90 and above the largest error: 3° (the 2026-09-07 calibration set
  it above the worst window and about twice the p90; P7 used twice the p90). The period had
  |error| p50 0.0065, p90 0.021, max 0.037 nm; its 0.15 nm tolerance is unchanged.
  Chance audit at 3°, 2000 seeds (``audit chance --holdout``): the three orientations together
  pass 0.70 % in-sample (Wilson 95 %: 0.42–1.17 %) and 1/1000 held out (0.02–0.56 %); a sheet that
  also chooses where it reports (two claims at one place, the third at one of 48 layouts 10–90 nm
  away) reaches 1.85 % in-sample and 8/1000 held out (0.41–1.57 %). On the physics before
  2026-11-27 (6°, the mean direction or either arm accepted) the audit gave 4.3 % (300 seeds).

  The period tolerance is set by the frame, not by the physics: 120 nm holds nineteen stripe
  periods, so one FFT bin is a third of a nanometre and a reading can snap to a bin. Averaging
  windows is what brings it back, and it is why the baseline never reports a single frame.

  **Distinctness criterion (since 2026-11-27).** One arm is one rotational domain. Two places
  on one arm have the same line direction and fail ``distinct_from``; two neighbouring arms of
  the zigzag differ by 60° and pass, as do arms in regions of another orientation. Before
  2026-11-27 a domain was a whole zigzag region and its two arms (2·alpha apart, alpha up to
  18°) did not count as two domains; the truths compared were the regions' mean directions.

  **Budget rationale.** The original two hours predated the drift work. The task as it now
  stands is: settle, take a frame that shows the reconstruction, characterise the drift there,
  program the compensation, verify it helped, then survey enough windows for a median period
  and walk far enough to reach a second rotational domain. Measured across seeds 0–4 on
  2026-09-08 that takes 1.7–2.8 sim hours. Three hours covers it with room for an agent that
  is less direct about it, and is still a real constraint — the earlier runs that spent
  measurement-grade frames on registration went over it while verifying every claim.

  The tolerances remain unchanged. The budget increase accounts for the measured acquisition
  time while preserving the required measurement accuracy.

  **Surface condition rationale.** Adsorbate density is 150 / µm² — one or two defects in
  a 100 nm frame, which is what a well-prepared Au(111) actually looks like. It used to be
  2 / µm², i.e. one defect per 700 nm square, leaving few registration features. The
  reconstruction is a 6.3 nm grating, and a grating constrains only the component
  across its stripes and only modulo one period, so a frame with nothing else in it cannot be
  used to measure drift. Registration needs something aperiodic, and real surfaces have it.
  (Measured on seed 0: the sample moved (−0.78, −1.09) nm between two frames of bare
  herringbone and the correlation reported (−0.13, +0.75).)

  **Terrace-width rationale (250 nm).** A step is 235 pm and the reconstruction
  10, so a window with a step edge in it has its stripe peak dragged off by the step. On a
  17 nm terrace no step-free window exists at all and the claim would be unmeasurable.

  **Chevron-period scope.** The height field keeps the pre-domain expression
  ``cos(2*pi*(u + s*zig(v)*v)/T)`` bit for bit, and in it the phase drifts linearly along the
  stripe direction: consecutive elbows do not repeat, so there is no elbow spacing to measure.
  (Real Au(111) shifts the stripes by a *bounded* triangle wave.) Measurements on eight seeds
  agreed: a period was found in three or four of them, with a median error above 50 %. A claim
  the instrument cannot deliver would weaken the measurement contract, so the elbow spacing stays in the
  physics and out of the scoring. ``chevron_period_nm`` is still drawn per seed because it
  sets the zigzag; it is simply not scored.

  Adding a key to the ``hidden`` block reorders the draws for every seed, because the sampler
  walks the keys in sorted order. Re-derive the tolerances if that happens.
