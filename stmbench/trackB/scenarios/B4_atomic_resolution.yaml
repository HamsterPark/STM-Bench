success: {kind: atomic_resolution}
notes: |
  The tip is already sharp (apex σ 0.06 nm < σ* 0.09) and stable; what is tested is the working
  point (Au(111) needs ≤ 0.15 V — the imaged corrugation is 30 pm × transfer, 2 pm Z noise floor)
  and the frame size / speed. ``frames_passed_atomic`` comes from episode._verdict_extras, which
  reads the scripted skill's ``data.achieved``; the truth side checks single apex, sharp, alive.
