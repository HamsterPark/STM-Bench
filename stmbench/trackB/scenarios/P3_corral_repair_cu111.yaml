id: P3_corral_repair_cu111
family: P3
variant: L1_repair
paper:
  id: P3
  title: "Crommie, Lutz, Eigler 1993 — confinement of electrons to quantum corrals"
  ref: "Science 262, 218"
rig: reference-stm
material: Cu(111)
time_scale: 20
initial:
  approached: true
  bias_v: 0.01
  setpoint_a: 1.0e-9
  tip: {radius_nm: 1.0, apex_sigma_nm: 0.08, lambda_per_s: 1.0e-4}
  surface:
    contamination: 0.0
    adsorbate_density_per_um2: 3.0
    terrace_median_nm: 150.0
    surface_state: {material: "Cu(111)"}
  adatoms: {layout: corral, species: Fe, field_per_100nm2: 0.3, field_half_nm: 150}
  spectroscopy:
    condition: {stab_bias_v: 0.1, stab_setpoint_a: 1.0e-9, start_v: -0.6, end_v: 0.4,
                num_points: 220, label: "P3 corral centre"}
  # the mechanisms that leave no safe place at the instrument (stmsim/physics/switches.py), as
  # P4 has them: since 2026-11-16 the STM tasks run on one instrument (see P3_corral_cu111's notes)
  physics: {tip_changes_outside_scans: true, tip_recovery: true, tip_anisotropy: true, crash_over_range: true}
faults: []
task: |
  样品是 Cu(111)，扫描坐标原点附近 60 nm 内有一圈 Fe 原子排成的圆形围栏，环上缺了几个原子，
  缺口外侧散落着几个备用 Fe 原子（备用原子的个数与环上缺的个数相同），仪器已在隧穿态；
  请复现 1993 年量子围栏的实验：先用横向操纵把备用原子补进环上的空位使围栏闭合，再从修好的
  围栏的形貌图量出围栏的半径（nm），测出围栏中心的 dI/dV 谱，报告半径和能量最低的两个可分辨
  共振峰的能量（meV，相对费米能级），用 ReportResult 报告。
task_en: >-
  The sample is Cu(111). Within 60 nm of the origin of the scan coordinates there is a circular
  corral formed by a ring of Fe atoms, with a few atoms missing from the ring and a few spare Fe
  atoms scattered outside the gap (there are as many spare atoms as atoms missing from the ring),
  and the instrument is already in the tunnelling state. Please reproduce the 1993 quantum-corral
  experiment: first use lateral manipulation to fill the vacancies in the ring with the spare
  atoms so that the corral closes, then measure the radius of the repaired corral (nm) from a
  topograph and the dI/dV spectrum at its centre, and report the radius and the energies of the
  two lowest resolvable resonance peaks (meV, relative to the Fermi level) with ReportResult.
budget: {sim_hours: 6, wire_cmds: 720000}
hidden:
  adatoms:
    ring_n: [36, 60]
    ring_radius_nm: [5.5, 9.0]
    gap_atoms: [3, 6]
    # point-tip height; a good tip shows ~0.6 of it, i.e. 50-90 pm (AdatomParams.height_m)
    height_pm: [80.0, 140.0]
    sigma_nm: [0.25, 0.35]
    delta_rad: [0.9, 1.5]
    alpha: [0.30, 0.60]
    r_threshold_kohm: {range: [80.0, 400.0], log: true}
    r_pick_kohm: [15.0, 40.0]
    v_max_nm_s: [0.5, 2.0]
    capture_radius_nm: [0.35, 0.6]
    p_slip: [0.002, 0.010]
    p_slip_scan: [0.03, 0.10]
  surface_state:
    e0_ev: [-0.47, -0.41]
    m_star: [0.35, 0.42]
    gamma_f_ev: [0.004, 0.010]
    gamma_0_ev: [0.012, 0.024]
  tip:
    # the state the tip arrives in (Tip.apply_condition). The task never says which: finding
    # out, and fixing it, is the first job of any session at the instrument
    condition: {choice: [good, blunt, double, unstable, dirty], weights: [0.2, 0.25, 0.25, 0.15, 0.15]}
    condition_scale: [0.0, 1.0]
    condition_angle_deg: [0.0, 360.0]
claims:
  - id: ring_occupancy
    say: "围栏须修好：设计的环上被原子占据的位点比例（原子离设计位置在半个位点间距以内算占据）"
    say_en: "The corral must be repaired: the fraction of the designed ring sites that are occupied by an atom (an atom within half a site spacing of the designed position counts as occupying it)"
    kind: constraint
    unit: fraction
    truth: corral.ring_occupancy
    min: 0.97
    evidence:
      kind: frame_covers_after
      point: corral.centre_nm
      min_fov_nm: 15
      max_nm_per_px: 0.2
      after_event: adatom_hop
  - id: peak_lo_mev
    say: "修好之后，围栏中心 dI/dV 谱上能量最低的两个可分辨共振峰中较低的那个（相对费米能级）"
    say_en: "After the repair, the lower of the two lowest-energy resolvable resonance peaks in the dI/dV spectrum at the corral centre (relative to the Fermi level)"
    kind: peak_in_list
    unit: meV
    tol: {abs: 10}
    rank_max: 3
    truth: corral.peaks_mev
    evidence: &centre
      kind: sts_at_corral_centre
      min_n: 1
      max_centre_dist_nm: 1.0
      min_points: 100
      v_lo_max: -0.45
      v_hi_min: 0.1
      after_event: adatom_hop
  - id: peak_hi_mev
    say: "这两个共振峰中较高的那个（相对费米能级）"
    say_en: "The higher of these two resonance peaks (relative to the Fermi level)"
    kind: peak_in_list
    unit: meV
    tol: {abs: 10}
    rank_max: 3
    truth: corral.peaks_mev
    distinct_from: {claim: peak_lo_mev}
    greater_than: peak_lo_mev
    evidence: *centre
  - id: radius_nm
    say: "围栏的半径：围栏原子中心所在圆的半径（要用修好之后的围栏拍的一幅完整恒流形貌来量）"
    say_en: "Radius of the corral: the radius of the circle on which the centres of the corral atoms lie (to be measured on a complete constant-current frame of the repaired corral)"
    kind: scalar
    unit: nm
    tol: {abs: 0.15}
    truth: corral.radius_nm
    evidence:
      kind: frame_covers_after
      point: corral.centre_nm
      min_fov_nm: 22
      max_nm_per_px: 0.15
      after_event: adatom_hop
success: {kind: claims_verified}
notes: |
  The measuring half of this scenario is P3_corral_cu111; what is added is that the ring
  arrives broken. Three to six adjacent sites are empty and the same number of spare Fe atoms
  sit 3–6 nm outside the gap, so the corral has to be finished before it can be measured.

  ``ring_occupancy`` is a constraint on the truth, not a reported number: it passes when at
  least 97 % of the designed ring sites hold an atom, which for a 36–60 atom ring means every
  site but at most one. "Hold" is geometric — an atom within half a site spacing of the
  designed position — not a lattice index: the confinement comes from atoms sitting on the
  ring, and the levels are recomputed from where they are. Counting exact indices failed a
  repair whose spectra were right (2026-09-11 trial: six atoms put back on the circle, one
  on the designed index). Its evidence is a close frame taken **after** a manipulation event, so
  a run that never touched an atom cannot inherit a full ring from a lucky draw. Both spectral
  claims carry the same ``after_event``, which is what makes this a repair task rather than a
  measurement with extra steps: a spectrum of the broken ring does not count.

  Two things make the repair a real operation rather than a formality. The pull threshold is
  drawn on a log scale over 80–400 kΩ, so the agent has to find the resistance at which the
  atom follows. And the same low resistance picks the atom up onto the tip instead of dragging
  it when it goes too far, which changes how the tip images and does spectroscopy afterwards.

  The confined levels are set by the ring the agent finishes, not by the one it was given:
  ``corral.peaks_mev`` is recomputed whenever an atom moves. Repairing the ring therefore
  moves the answer, which is the point.

  Calibration (2026-11-16). Before: a fixed answer sheet passed 56.5 % of seeds 0-199 (each peak
  86.5 %, peaks 25 meV, no radius claim). Now, as P3's measurement variant was calibrated
  (2026-10-13): peaks 10 meV, and a ``radius_nm`` claim (0.15 nm) read on a complete frame of
  the repaired corral at 0.15 nm/px or finer, 22 nm or wider, scanned after the last hop
  (``frame_covers_after``, as ``ring_occupancy`` has it). The ring's radius is not changed by the
  repair, but a frame of the broken ring is not a measurement of the closed corral the task asks
  for. Chance (best fixed sheet, exact, seeds 0-399): each peak 40.2 %, radius 12.0 %, all
  claims 4.8 % (seeds 0-199 alone: 7.0 %, the spread between two halves of 200 seeds is
  about 2 points). The hidden ranges did not change; a log-uniform radius 4-10 nm as P3 has gave
  4.5 % over the same 400 seeds, but an earlier version of the privileged reference (2026-11-16, before its
  last two fixes) closed only 27 of 30 rings (seed 28: radius 4.3 nm, 58 atoms, 0.47 nm apart, a site held only within 0.23 nm), so the
  range stays 5.5-9 nm.

  The task text says the spare atoms are as many as the missing ones: the ring's atoms, 0.6-1.4 nm
  apart, mostly merge into one ridge in a topograph and cannot be counted one by one, the spares can
  (DESIGN 9.5). It says only the count, not why: a sentence on how the ring looks would be untrue
  for the widest-spaced rings (1.3 nm apart they are separate bumps) and would tell the agent what
  to expect to see. It also asks for the radius of the repaired corral, since the radius is now a
  claim (2026-11-16).

  Privileged reference (stmbench/reference/p3_repair.py, ``reference --paper P3R``): the gap and
  its sites from a survey (the ring's cross-section falls to half at the gap), the spares
  dragged by the resistance ladder to a staging point 1.5 nm outside their site and in, the
  last approach closed until the atom is within 0.2 nm of the site, then P3's measurement.
  Seeds 0-29: 30/30. A hold-out of seeds 210-329 (never used while the protocol was written):
  118/120; both failures were the radius read 0.23 nm off on a frame in which the tip changed.
  Instrument time over the 148 successes: median 1371 s, p90 2496 s, longest 3405 s. The
  budget was set at 2.5 h (9000 s), 3.6 times this p90, as P4's 1.5 h is 3.8 times its
  reference's p90. Since 2026-11-17 it is 5 h: the scripted baseline that sees only what an
  agent sees (stmbench/baselines/p3_repair.py) finds the spares and the sites from frames and
  needs far longer. Under 2.5 h its successes on the hold-out seeds 240-329 took a median 4910 s
  and a p90 6001 s, and 8 of its 90 runs ran out of time, which left an operator slower than that
  script no room. 5 h is 3.0 times that p90, as P4's 1.5 h is 3.4 times its baseline's. Later that
  day it became 6 h (wire_cmds 720000): under 5 h the final baseline (docs/DESIGN.md 9.8) is no
  longer cut off by the budget, and its successes on seeds 240-329 took a p90 of 7081 s, so 5 h was
  only 2.5 times it. 6 h is 3.05 times, the rule P4 (3.4) and the measurement P3 (2.9-3.3) follow.
  No run failed on the 5 h budget, so those results stand under 6 h. Reported
  |error|: peaks median 1.1 meV, p90 about 3 meV; radius median 0.02 nm, p90 0.05 nm. A tip that
  starts blunt, double or unstable is conditioned far from the corral first, and again whenever a
  drag changes it (median 3 conditioning rounds per run over seeds 0-29 and 210-329; 26 of the 28
  good-tip runs needed none), which is where the time goes.

  **Chance on 2000 seeds, with a held-out estimate (2026-11-16/17, code 9716850, ``audit chance
  --scenario P3_corral_repair_cu111 --seeds 2000 --holdout``, khwu).** Per claim, best fixed answer on
  seeds 0-1999: each peak 36.8 %, radius 10.2 % (``ring_occupancy`` is a state claim and is not
  audited). All measure claims, sheet chosen and scored on the same 2000 seeds: 3.55 % (Wilson 95 %
  2.82-4.45 %), biased high. Sheet chosen on seeds 0-999 and scored on seeds 1000-1999: 23/1000 = 2.30 %
  (1.54-3.43 %). This replaces the 4.8 % on 400 seeds above as the figure to hold against the 5 % gate:
  that interval straddled the gate, this one does not. No range, tolerance or rule changed.

  **The rig's tip is an etched W wire, not a qPlus fork (2026-11-17, decided by the user).** A poke
  above 50 mV no longer rings a fork up, and a reshaping pulse leaves a better tip with probability 0.55
  instead of 0.50; the worlds at the start (layout, hidden draws, random streams) are unchanged.
  The numbers above were measured with the qPlus form; the numbers on the new physics are re-run
  on the P3 branch (bench/p3-osworld). A ledger recorded before this with a high-bias poke does not
  replay with this code, and one with a pulse may not (docs/DESIGN.md, 2026-11-17).

  **Spectra and dI/dV maps see every apex (2026-11-24, docs/DESIGN.md 9.3).** A spectrum takes the
  LDOS under each apex by its share of the current. Re-run on the current code, on the same seeds:
  - the privileged reference: 30/30 on seeds 0-29 and 117/120 on the hold-out 210-329. The seed it
    lost, 326, had passed before. When its spectra were taken, a secondary apex 2.1 nm off the tip's
    centre carried 97 % of the current, so the measured peaks were those of the LDOS there, and the
    lowest was read 36.9 meV off. Its 147 successes took a median 1361 s and a p90 2462 s;
  - the scripted baseline: 22/30 on seeds 0-29 and 58/90 on 240-329 under the 6 h budget, the counts
    it had under 5 h.
  The figures above stay as they were measured. Per seed: docs/results/.
