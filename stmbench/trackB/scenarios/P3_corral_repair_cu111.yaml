id: P3_corral_repair_cu111
family: P3
variant: L1_repair
paper:
  id: P3
  title: "Crommie, Lutz, Eigler 1993 — confinement of electrons to quantum corrals"
  ref: "Science 262, 218"
rig: reference-stm
material: Cu(111)
time_scale: 20
initial:
  approached: true
  bias_v: 0.01
  setpoint_a: 1.0e-9
  tip: {radius_nm: 1.0, apex_sigma_nm: 0.08, lambda_per_s: 1.0e-4}
  surface:
    contamination: 0.0
    adsorbate_density_per_um2: 3.0
    terrace_median_nm: 150.0
    surface_state: {material: "Cu(111)"}
  adatoms: {layout: corral, species: Fe, field_per_100nm2: 0.3, field_half_nm: 150}
  spectroscopy:
    condition: {stab_bias_v: 0.1, stab_setpoint_a: 1.0e-9, start_v: -0.6, end_v: 0.4,
                num_points: 220, label: "P3 corral centre"}
faults: []
task: |
  样品是 Cu(111)，扫描坐标原点附近 60 nm 内有一圈 Fe 原子排成的圆形围栏，环上缺了几个原子，
  缺口外侧散落着几个备用 Fe 原子，仪器已在隧穿态；请复现 1993 年量子围栏的实验：先用横向操纵
  把备用原子补进环上的空位使围栏闭合，再测出围栏中心的 dI/dV 谱，报告能量最低的两个可分辨
  共振峰的能量（meV，相对费米能级），用 ReportResult 报告。预算：2.5 小时仪器时间。
budget: {sim_hours: 2.5, wire_cmds: 300000}
hidden:
  adatoms:
    ring_n: [36, 60]
    ring_radius_nm: [5.5, 9.0]
    gap_atoms: [3, 6]
    height_pm: [50.0, 90.0]
    sigma_nm: [0.25, 0.35]
    delta_rad: [0.9, 1.5]
    alpha: [0.30, 0.60]
    r_threshold_kohm: {range: [80.0, 400.0], log: true}
    r_pick_kohm: [15.0, 40.0]
    v_max_nm_s: [0.5, 2.0]
    capture_radius_nm: [0.35, 0.6]
    p_slip: [0.002, 0.010]
    p_slip_scan: [0.03, 0.10]
  surface_state:
    e0_ev: [-0.47, -0.41]
    m_star: [0.35, 0.42]
    gamma_f_ev: [0.004, 0.010]
    gamma_0_ev: [0.012, 0.024]
  tip:
    # the state the tip arrives in (Tip.apply_condition). The task never says which: finding
    # out, and fixing it, is the first job of any session at the instrument
    condition: {choice: [good, blunt, double, unstable, dirty], weights: [0.2, 0.25, 0.25, 0.15, 0.15]}
    condition_scale: [0.0, 1.0]
    condition_angle_deg: [0.0, 360.0]
claims:
  - id: ring_occupancy
    kind: constraint
    unit: fraction
    truth: corral.ring_occupancy
    min: 0.97
    evidence:
      kind: frame_covers_after
      point: corral.centre_nm
      min_fov_nm: 15
      max_nm_per_px: 0.2
      after_event: adatom_hop
  - id: peak_lo_mev
    kind: peak_in_list
    unit: meV
    tol: {abs: 25}
    rank_max: 3
    truth: corral.peaks_mev
    evidence: &centre
      kind: sts_at_corral_centre
      min_n: 1
      max_centre_dist_nm: 1.0
      min_points: 100
      v_lo_max: -0.45
      v_hi_min: 0.1
      after_event: adatom_hop
  - id: peak_hi_mev
    kind: peak_in_list
    unit: meV
    tol: {abs: 25}
    rank_max: 3
    truth: corral.peaks_mev
    distinct_from: {claim: peak_lo_mev}
    greater_than: peak_lo_mev
    evidence: *centre
success: {kind: claims_verified}
notes: |
  The measuring half of this scenario is P3_corral_cu111; what is added is that the ring
  arrives broken. Three to six adjacent sites are empty and the same number of spare Fe atoms
  sit 3–6 nm outside the gap, so the corral has to be finished before it can be measured.

  ``ring_occupancy`` is a constraint on the truth, not a reported number: it passes when at
  least 97 % of the designed ring sites hold an atom, which for a 36–60 atom ring means every
  site but at most one. "Hold" is geometric — an atom within half a site spacing of the
  designed position — not a lattice index: the confinement comes from atoms sitting on the
  ring, and the levels are recomputed from where they are. Counting exact indices failed a
  repair whose spectra were right (2026-09-11 trial: six atoms put back on the circle, one
  on the designed index). Its evidence is a close frame taken **after** a manipulation event, so
  a run that never touched an atom cannot inherit a full ring from a lucky draw. Both spectral
  claims carry the same ``after_event``, which is what makes this a repair task rather than a
  measurement with extra steps: a spectrum of the broken ring does not count.

  Two things make the repair a real operation rather than a formality. The pull threshold is
  drawn on a log scale over 80–400 kΩ, so the agent has to find the resistance at which the
  atom follows. And the same low resistance picks the atom up onto the tip instead of dragging
  it when it goes too far, which changes how the tip images and does spectroscopy afterwards.

  The confined levels are set by the ring the agent finishes, not by the one it was given:
  ``corral.peaks_mev`` is recomputed whenever an atom moves. Repairing the ring therefore
  moves the answer, which is the point.
