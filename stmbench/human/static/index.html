<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STM-Bench 人工模式</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1c1e22; --muted: #6b7280; --line: #e3e5e9;
    --accent: #1f5fbf; --accent-ink: #ffffff; --ok: #1a7f37; --bad: #b42318; --warn: #b7791f;
    --me: #eef4ff; --op: #f7f7f2; --tool: #f6f8fa; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; padding: 5px 10px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { background: #fff5f5; color: var(--bad); border-color: #f0c2c2; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; color: var(--ink); width: 100%; }
  textarea { resize: vertical; min-height: 60px; font-family: var(--mono); font-size: 12.5px; }
  code, pre { font-family: var(--mono); font-size: 12.5px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; }

  header { display: flex; gap: 16px; align-items: center; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header .brand { font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #eee; }
  .badge.awaiting { background: #e6f4ea; color: var(--ok); }
  .badge.running { background: #fff4e5; color: var(--warn); }
  .badge.starting { background: #e8f0fe; color: var(--accent); }
  .badge.finished { background: #e8f0fe; color: var(--accent); }
  .badge.error { background: #fdecea; color: var(--bad); }
  .meter { display: flex; flex-direction: column; gap: 2px; min-width: 220px; }
  .meter progress { width: 100%; height: 8px; }
  .meter .lbl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

  main { display: grid; grid-template-columns: 300px minmax(420px, 1fr) 400px; gap: 12px; padding: 12px 14px; height: calc(100vh - 54px); }
  @media (max-width: 1200px) { main { grid-template-columns: 1fr; height: auto; } .col { max-height: none !important; } }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .col > .hd { padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .col > .bd { padding: 10px 12px; overflow: auto; flex: 1 1 auto; min-height: 0; }

  /* tools */
  .tool-group { margin: 8px 0 4px; font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: .02em; }
  .tool { display: block; width: 100%; text-align: left; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; }
  .tool:hover { background: #f1f3f6; }
  .tool.active { background: var(--me); border-color: #c9d8f5; }
  .tool .nm { font-family: var(--mono); font-size: 12.5px; }
  .tool .ds { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool.stub .nm { color: var(--muted); }
  .tool.pinned .nm { color: var(--accent); font-weight: 600; }

  /* transcript */
  .task { background: #fffbe6; border: 1px solid #f3e4a8; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .msg { border-radius: 8px; padding: 8px 10px; margin: 8px 0; border: 1px solid var(--line); }
  .msg.human { background: var(--op); }
  .msg.ai { background: var(--me); }
  .msg.tool { background: var(--tool); }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
  .msg .who b { color: var(--ink); }
  .call { font-family: var(--mono); font-size: 12.5px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin-top: 4px; }
  .clip { max-height: 260px; overflow: hidden; position: relative; }
  .clip.open { max-height: none; }
  .clip-more { display: block; margin-top: 4px; }
  .live { border: 1px dashed #c9d8f5; border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: #fbfdff; }
  .ev { font-family: var(--mono); font-size: 12px; margin: 2px 0; white-space: pre-wrap; word-break: break-word; }
  details.sys summary { cursor: pointer; color: var(--muted); font-size: 12px; }

  /* composer */
  .composer { border-top: 1px solid var(--line); padding: 10px 12px; background: #fafbfc; }
  .composer h4 { margin: 0 0 6px; font-family: var(--mono); font-size: 13px; }
  .field { margin: 6px 0; }
  .field label { display: block; font-size: 12.5px; margin-bottom: 2px; }
  .field label .req { color: var(--bad); }
  .field .desc { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: pre-wrap; }
  .desc-full { max-height: 160px; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; white-space: pre-wrap; margin-bottom: 8px; }
  .endbox { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: var(--accent); border-radius: 50%; animation: sp 1s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* files */
  .tabs { display: flex; gap: 4px; }
  .tabs button.on { background: var(--me); border-color: #c9d8f5; }
  .file { display: flex; gap: 8px; padding: 6px; border-radius: 6px; border: 1px solid transparent; align-items: center; }
  .file:hover { background: #f1f3f6; }
  .file.active { background: var(--me); border-color: #c9d8f5; }
  .file img { width: 56px; height: 56px; object-fit: contain; background: #222; border-radius: 4px; image-rendering: pixelated; }
  .file .info { font-size: 12px; line-height: 1.35; min-width: 0; }
  .file .info .nm { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer { border-top: 1px solid var(--line); padding: 8px 12px; background: #fafbfc; }
  .viewer .img { position: relative; width: 100%; background: #111; border-radius: 6px; overflow: hidden; }
  .viewer .img img { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: crosshair; }
  .viewer .readout { font-family: var(--mono); font-size: 12px; margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .viewer select, .viewer input { width: auto; }
  .legend { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #000, #fff); margin: 4px 0 0; }

  /* start & verdict */
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: #fff; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px #dbe7fb; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card .task-text { white-space: pre-wrap; font-size: 13px; }
  table.claims { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.claims th, table.claims td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.claims td.num { font-family: var(--mono); }
  .verdict-hd { font-size: 20px; font-weight: 600; margin: 4px 0 8px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  #err { background: #fdecea; color: var(--bad); padding: 6px 12px; display: none; }
</style>
</head>
<body>
<header>
  <div class="brand">STM-Bench · 模式 H（人工操作）</div>
  <div id="hdr-scn" class="muted">未开始</div>
  <span id="hdr-phase" class="badge">idle</span>
  <div class="meter" id="m-sim" hidden>
    <div class="lbl"><span>仪器时间</span><span id="m-sim-txt">–</span></div>
    <progress id="m-sim-bar" max="1" value="0"></progress>
  </div>
  <div class="meter" id="m-cmd" hidden>
    <div class="lbl"><span>控制器命令</span><span id="m-cmd-txt">–</span></div>
    <progress id="m-cmd-bar" max="1" value="0"></progress>
  </div>
  <div id="hdr-misc" class="small muted"></div>
  <div class="grow"></div>
  <button id="btn-cancel" class="danger" hidden>放弃本回合 [ABORT]</button>
</header>
<div id="err"></div>
<main>
  <section class="col" id="col-left">
    <div class="hd">工具 <span id="tools-count" class="muted small"></span><div class="grow"></div><input id="tool-q" placeholder="搜索…" style="width:120px"></div>
    <div class="bd" id="tools"></div>
  </section>
  <section class="col" id="col-center">
    <div class="hd">对话（模型视角）<div class="grow"></div><span id="calls" class="muted small"></span></div>
    <div class="bd" id="center"></div>
    <div class="composer" id="composer" hidden></div>
  </section>
  <section class="col" id="col-right">
    <div class="hd">仪器留下的文件 <div class="grow"></div><div class="tabs"><button id="tab-sxm" class="on">帧</button><button id="tab-dat">谱</button></div></div>
    <div class="bd" id="files"></div>
    <div class="viewer" id="viewer" hidden></div>
  </section>
</main>

<script>
'use strict';
// ───────────────────────── state ─────────────────────────
const S = {
  v: -1, seq: null, since: 0, st: null, scenarios: null, selScenario: null,
  transcriptCall: null, transcript: null, tools: [], selTool: null, rawMode: false,
  files: [], tab: 'sxm', selFile: null, viewer: { ch: 'Z', dir: 'forward', flatten: 'plane', cmap: 'gray', meta: null },
  lastPick: null, filesTimer: null, budgetTimer: null, verdictShown: null,
};
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v; else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function showErr(msg) { const e = $('err'); if (!msg) { e.style.display = 'none'; return; } e.textContent = msg; e.style.display = 'block'; }
function fmtHMS(s) { if (s == null || !isFinite(s)) return '–'; s = Math.max(0, Math.round(s)); const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60; return `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`; }
function fmtNum(x, d = 3) { if (x == null || x === '') return '–'; const n = Number(x); if (!isFinite(n)) return String(x); if (Math.abs(n) >= 1e4 || (Math.abs(n) < 1e-3 && n !== 0)) return n.toExponential(d); return String(+n.toFixed(d)); }
function fmtSI(x, unit) { if (x == null) return '–'; const a = Math.abs(x); const tbl = [[1e-12, 'p'], [1e-9, 'n'], [1e-6, 'µ'], [1e-3, 'm'], [1, '']]; let p = tbl[tbl.length - 1]; for (const t of tbl) { if (a < t[0] * 1000) { p = t; break; } } return `${fmtNum(x / p[0], 3)} ${p[1]}${unit}`; }
function jsonShort(o, n = 160) { let s; try { s = JSON.stringify(o); } catch (e) { s = String(o); } return s.length > n ? s.slice(0, n) + '…' : s; }

// ───────────────────────── polling ─────────────────────────
async function poll() {
  for (;;) {
    try {
      const q = `v=${S.v}&seq=${S.seq === null ? '' : S.seq}&since=${S.since}&wait=25`;
      const st = await api(`/api/state?${q}`);
      if (st.seq !== S.seq) { newEpisode(st.seq); }
      const changed = st.version !== S.v;
      S.v = st.version; S.since = st.n_events;
      if (st.events && st.events.length) S.events.push(...st.events);
      S.st = st;
      if (changed || st.events.length) render();
      showErr(null);
    } catch (e) { showErr(`连接失败：${e.message}`); await sleep(1500); }
  }
}
function newEpisode(seq) {
  S.seq = seq; S.since = 0; S.events = []; S.transcript = null; S.transcriptCall = null;
  S.selTool = null; S.files = []; S.selFile = null; S.verdictShown = null; S.lastPick = null;
  $('viewer').hidden = true;
}
S.events = [];
function budgetTick() {
  if (!S.st || S.st.phase !== 'running') return;
  api(`/api/state?since=${S.since}`).then(st => { if (st.seq !== S.seq) return; S.st.budget = st.budget; renderHeader(); }).catch(() => {});
}
setInterval(budgetTick, 2000);
setInterval(() => { if (S.st && (S.st.phase === 'running' || S.st.phase === 'awaiting_action')) refreshFiles(); }, 5000);

// ───────────────────────── rendering ─────────────────────────
function render() {
  const st = S.st;
  renderHeader();
  if (st.phase === 'idle' || ((st.phase === 'finished' || st.phase === 'error') && S.dismissed === st.seq)) { renderStart(); $('composer').hidden = true; S.tools = []; renderTools(); return; }
  if (st.phase === 'finished' || st.phase === 'error') { renderVerdict(); $('composer').hidden = true; $('btn-cancel').hidden = true; S.tools = []; renderTools(); refreshFiles(); return; }
  // starting / awaiting / running
  if (st.request && st.request.call !== S.transcriptCall) { loadTranscript(st.request.call); }
  if (st.request) S.tools = st.request.tools || [];
  renderTools();
  renderCenter();
  renderComposer();
  refreshFiles();
}
function renderHeader() {
  const st = S.st; if (!st) return;
  const ph = st.phase;
  const b = $('hdr-phase'); b.className = 'badge ' + ph;
  b.textContent = { idle: '空闲', starting: '正在启动仪器与 MAST…', awaiting_action: '等你操作（时钟已暂停）', running: '仪器执行中（时钟运行）', finished: '已结束', error: '出错' }[ph] || ph;
  $('hdr-scn').textContent = st.scenario && st.scenario.id ? `${st.scenario.id} · seed ${st.seed} · ×${st.time_scale}` : '未开始';
  const bud = st.budget || {};
  const show = ph !== 'idle';
  $('m-sim').hidden = !show; $('m-cmd').hidden = !show;
  if (show) {
    const used = bud.sim_used_s, max = bud.sim_max_s;
    $('m-sim-txt').textContent = `${fmtHMS(used)} / ${max ? fmtHMS(max) : '∞'}`;
    $('m-sim-bar').value = max && used != null ? Math.min(1, used / max) : 0;
    const cu = bud.cmds_used, cm = bud.cmds_max;
    $('m-cmd-txt').textContent = `${cu == null ? '–' : cu.toLocaleString()} / ${cm ? cm.toLocaleString() : '∞'}`;
    $('m-cmd-bar').value = cm && cu != null ? Math.min(1, cu / cm) : 0;
    $('hdr-misc').textContent = `回复 ${st.calls || 0} 次 · 墙钟 ${fmtHMS(bud.wall_s)}${bud.clock_paused == null ? '' : (bud.clock_paused ? ' · 时钟暂停' : ' · 时钟运行')}`;
  } else $('hdr-misc').textContent = '';
  $('btn-cancel').hidden = !(ph === 'awaiting_action' || ph === 'running' || ph === 'starting');
  $('calls').textContent = st.request ? `第 ${st.request.call} 次回复 · ${st.request.n_messages} 条消息` : '';
}

// ── start page ──
async function renderStart() {
  const c = $('center');
  if (!S.scenarios) { c.replaceChildren(h('div', { class: 'muted' }, '读取场景…')); try { const j = await api('/api/scenarios'); S.scenarios = j.scenarios; S.out = j.out; } catch (e) { c.replaceChildren(h('div', { class: 'bad' }, `读取场景失败：${e.message}`)); return; } }
  const list = h('div');
  list.append(h('p', { class: 'muted small' }, '选一道题。你将拿到与 LLM 完全相同的题面、工具面、预算与判据；不同的只有右栏能看到仪器存下的图。想清楚再点工具：只有仪器在跑的时候时钟才走，你思考时时钟是停的。'));
  const papers = S.scenarios.filter(s => s.family && s.family.startsWith('P'));
  const others = S.scenarios.filter(s => !(s.family && s.family.startsWith('P')));
  const mk = (s) => {
    const card = h('div', { class: 'card' + (S.selScenario === s.id ? ' sel' : ''), onclick: () => { S.selScenario = s.id; renderStart(); } });
    if (s.error) { card.append(h('h3', null, s.id), h('div', { class: 'bad small' }, s.error)); return card; }
    card.append(h('h3', null, `${s.id}`, s.paper ? h('span', { class: 'muted' }, ` · ${s.paper.title || ''}`) : null));
    card.append(h('div', { class: 'small muted' }, `${s.material} · 预算 ${s.budget.sim_hours} 仪器小时 / ${(s.budget.wire_cmds || 0).toLocaleString()} 条命令 · time_scale ×${s.time_scale}${s.claims.length ? ` · ${s.claims.length} 条结果：${s.claims.map(x => x.id).join(', ')}` : ''}${s.faults ? ` · ${s.faults} 个预置故障` : ''}`));
    if (S.selScenario === s.id) card.append(h('div', { class: 'task-text' }, s.task || ''));
    return card;
  };
  list.append(h('div', { class: 'tool-group' }, '论文复现（上榜赛道）'), ...papers.map(mk));
  if (others.length) { const d = h('details'); d.append(h('summary', { class: 'muted small' }, `回归家族（B1–B9，不上榜）· ${others.length} 个`), ...others.map(mk)); list.append(d); }
  const sel = S.scenarios.find(s => s.id === S.selScenario);
  const seed = h('input', { id: 'seed', type: 'number', value: S.seed ?? 0, min: 0, style: 'width:90px' });
  const ts = h('input', { id: 'ts', type: 'number', value: S.ts ?? (sel ? sel.time_scale : 20), min: 1, step: 1, style: 'width:90px' });
  const btn = h('button', { class: 'primary', disabled: !sel, onclick: async () => {
    S.seed = +seed.value; S.ts = +ts.value; btn.disabled = true; btn.textContent = '启动中…';
    try { await api('/api/start', { scenario: sel.id, seed: +seed.value, time_scale: +ts.value || null }); } catch (e) { showErr(e.message); btn.disabled = false; btn.textContent = '开始'; }
  } }, '开始');
  list.append(h('div', { class: 'card' }, h('div', { class: 'row' }, h('span', null, 'seed'), seed, h('span', null, 'time_scale'), ts, btn, h('span', { class: 'muted small' }, sel ? `隐藏真值按 seed 抽取；time_scale 只影响墙钟，不影响预算与漂移` : '先选一道题'))));
  if (S.st && S.st.history && S.st.history.length) {
    list.append(h('div', { class: 'tool-group' }, '本进程已完成的回合'));
    for (const r of S.st.history) list.append(h('div', { class: 'small' }, `${r.scenario} seed ${r.seed} → `, h('b', { class: r.success ? 'ok' : 'bad' }, r.success ? '复现' : '未复现'), ` (partial ${fmtNum(r.partial, 2)}) `, h('code', { class: 'muted' }, r.run_dir)));
  }
  c.replaceChildren(list);
}

// ── tools ──
function renderTools() {
  const box = $('tools');
  const q = ($('tool-q').value || '').trim().toLowerCase();
  const tools = S.tools || [];
  $('tools-count').textContent = tools.length ? `${tools.filter(t => !t.stub).length} 可用 / ${tools.length}` : '';
  if (!tools.length) { box.replaceChildren(h('div', { class: 'muted small' }, S.st && S.st.phase === 'starting' ? '仪器启动后这里会列出工具' : '回合开始后这里列出你能调用的工具')); return; }
  const pinned = ['ReportResult', 'ReportTipState', 'ask_user'];
  const match = (t) => !q || t.name.toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q);
  const mk = (t, cls) => h('button', { class: 'tool ' + cls + (S.selTool && S.selTool.name === t.name ? ' active' : ''), onclick: () => selectTool(t.name) },
    h('span', { class: 'nm' }, t.name, t.touches_instrument ? h('span', { class: 'muted small' }, ' ⚙') : null),
    h('span', { class: 'ds' }, (t.description || '').split('\n')[0].replace(/^\[未加载·包 [^\]]*\]\s*/, '')));
  const frag = document.createDocumentFragment();
  const pin = tools.filter(t => pinned.includes(t.name) && match(t));
  if (pin.length) { frag.append(h('div', { class: 'tool-group' }, '结果通道 / 操作员')); pin.forEach(t => frag.append(mk(t, 'pinned'))); }
  const vis = tools.filter(t => !t.stub && !pinned.includes(t.name) && match(t)).sort((a, b) => a.name.localeCompare(b.name));

  add('运行目录', h('code', null, r.out_dir || ''));
  frag.append(kv);
  if (d.claims) {
    const tbl = h('table', { class: 'claims' });
    tbl.append(h('tr', null, ...['结果', '你报的', '真值', '容差', '值', '证据', '说明'].map(x => h('th', null, x))));
    for (const [cid, cl] of Object.entries(d.claims)) {
      const ev = cl.evidence || {}; const notes = [];
      if (cl.accept_deg) notes.push(`可接受 ${cl.accept_deg.map(x => fmtNum(x, 1)).join(' / ')}°`);
      if (cl.sample_xy_nm) notes.push(`样品系 (${fmtNum(cl.sample_xy_nm[0], 1)}, ${fmtNum(cl.sample_xy_nm[1], 1)})`);
      if (ev.reason) notes.push(ev.reason); if (ev.n_frames != null) notes.push(`${ev.n_frames} 帧合格`); if (ev.covered != null) notes.push(ev.covered ? `帧 #${ev.frame_idx} 覆盖` : '无帧覆盖该位置'); if (ev.n_spectra != null) notes.push(`${ev.n_spectra} 条谱 / ${ev.n_positions} 处`);
      if (cl.distinct_from_failed) notes.push('与另一条结果指向同一处（distinct_from）');
      tbl.append(h('tr', null, h('td', null, h('code', null, cid), h('div', { class: 'muted small' }, cl.kind)), h('td', { class: 'num' }, cl.value != null ? fmtNum(cl.value, 4) : h('span', { class: 'bad' }, cl.reported ? '有值无位置' : '未报告')), h('td', { class: 'num' }, cl.truth == null ? '–' : (typeof cl.truth === 'number' ? fmtNum(cl.truth, 4) : jsonShort(cl.truth))), h('td', { class: 'num small' }, jsonShort(cl.tol)), h('td', null, cl.value_ok ? h('b', { class: 'ok' }, '✓') : h('b', { class: 'bad' }, '✗')), h('td', null, cl.evidence_ok ? h('b', { class: 'ok' }, '✓') : h('b', { class: 'bad' }, '✗')), h('td', { class: 'small' }, notes.join('；'))));
    }
    frag.append(h('h4', { style: 'margin:12px 0 4px' }, `结果 ${d.n_verified ?? 0} / ${d.n_total ?? 0} 通过（报告 ${d.n_reported ?? 0}）`), tbl);
  } else if (d.checks) {
    frag.append(h('h4', { style: 'margin:12px 0 4px' }, '判据'), h('pre', { class: 'small' }, JSON.stringify(d.checks, null, 1)));
  }
  const ta = r.truth_after || {};
  const hidden = {}; for (const k of ['hidden', 'herringbone', 'surface_state', 'adatoms', 'corral', 'drift', 'tip']) { if (ta[k] != null && !(ta[k] && ta[k].enabled === false)) hidden[k] = ta[k]; }
  if (Object.keys(hidden).length) { const th = h('details'); th.append(h('summary', { class: 'muted small' }, '这颗 seed 的隐藏真值（回合结束后才可见）'), h('pre', { class: 'small', style: 'max-height:300px;overflow:auto' }, JSON.stringify(hidden, null, 1))); frag.append(th); }
  const det = h('details'); det.append(h('summary', { class: 'muted small' }, '完整判定 JSON'), h('pre', { class: 'small', style: 'max-height:300px;overflow:auto' }, JSON.stringify(v, null, 1))); frag.append(det);
  frag.append(h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'primary', onclick: backToStart }, '再来一题'), h('span', { class: 'muted small' }, '同一进程里再跑一题会沿用 MAST 的进程级状态；要完全干净就重启命令。')));
  c.replaceChildren(frag);
}
function backToStart() { S.dismissed = S.st.seq; S.scenarios = null; S.tools = []; S.verdictShown = null; render(); }

poll();
</script>
