name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13"]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set scratch data root
        # Runner paths are available once steps start, not in job-level env expressions.
        # Leave this directory absent so private-data tests skip at collection time.
        run: echo "STM_BENCH_DATA=$RUNNER_TEMP/stm_bench" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bench]"
      - name: Entry points import and parse
        run: |
          python -m stmsim serve --help
          python -m stmbench.cli --help
          stmsim serve --help
          stmbench --help
      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider --durations=10
